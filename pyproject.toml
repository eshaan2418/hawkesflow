[project]
name = "hawkesflow"
version = "0.1.0"
description = "Hawkes-process models of NASDAQ order flow: MLE, time-rescaling goodness of fit, simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "numba>=0.59"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
